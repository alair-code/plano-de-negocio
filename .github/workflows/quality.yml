name: Quality Checks

on:
  push:
    branches:
      - manutencao
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/management.js
          node --check js/server-sync.js
      - name: Run smoke test
        run: node tests/smoke.mjs
